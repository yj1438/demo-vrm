<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Landmarker · 面部识别</title>
  <link rel="stylesheet" href="/src/common/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">面部识别 <span class="badge">FaceLandmarker</span></div>
      <div class="app-subtitle">478 关键点 · ARKit52 表情系数 · 面部变换矩阵</div>
    </header>

    <section class="toolbar">
      <label class="btn btn-primary">
        上传图片
        <input id="J_btn_image" type="file" accept="image/*" hidden>
      </label>
      <button class="btn" id="J_btn_video">开启摄像头</button>
      <div class="toolbar-spacer"></div>
      <span class="toolbar-label">推理</span>
      <select class="select" id="J_delegate">
        <option value="GPU" selected>GPU</option>
        <option value="CPU">CPU</option>
      </select>
<span class="toolbar-label">灵敏度</span>
      <select class="select" id="J_sens">
        <option value="0.1">0.1 最宽松</option>
        <option value="0.3" selected>0.3 宽松</option>
        <option value="0.5">0.5 标准</option>
        <option value="0.7">0.7 严格</option>
      </select>
<span class="toolbar-label">人脸数</span>
      <select class="select" id="J_num_faces">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
      <span class="status-pill" id="J_status">就绪</span>
    </section>

    <main class="stage">
      <div>
        <div class="card">
          <div class="card-header">图片识别</div>
          <div class="card-body">
            <div class="viewport" id="J_view_image">
              <div class="placeholder">上传一张包含人脸的图片<br>面部网格将叠加绘制</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">摄像头识别</div>
          <div class="card-body">
            <div class="viewport" id="J_view_video">
              <div class="placeholder">开启摄像头后<br>实时绘制面部网格</div>
            </div>
          </div>
        </div>
      </div>

      <aside class="inspector card">
        <div class="card-header">识别结果</div>
        <div class="card-body" id="J_info">
          <div class="empty-hint">等待识别输入</div>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="/src/page-face-1/index.ts"></script>
</body>
</html>
